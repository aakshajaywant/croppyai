<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23502F">
<title>Croppy · coffee farm helper</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Atkinson";src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson";src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--leaf:#23502F;--mist:#E8F1EC;--ink:#14231A;--cherry:#9E1B32;--amber:#8A5300;--paper:#FFFFFF;--line:#C9D8CE;--soft:#3d5a46;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{font-family:"Atkinson",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.45;color:var(--ink);background:var(--paper);display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--leaf);color:#fff}
header h1{font-size:24px;margin:0}
header small{display:block;font-size:14px;opacity:.85;font-weight:400}
.lang{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.7);border-radius:999px;padding:8px 14px;font:inherit;font-size:16px;min-height:44px}
main{flex:1;overflow-y:auto;padding:18px;max-width:560px;width:100%;margin:0 auto}
nav{display:flex;border-top:2px solid var(--line);background:var(--paper)}
nav button{flex:1;min-height:62px;border:0;background:none;font:inherit;font-size:14px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;position:relative}
nav svg{width:24px;height:24px}
nav button[aria-current="true"]{font-weight:700;color:var(--leaf);box-shadow:inset 0 4px 0 var(--leaf)}
nav .dot{position:absolute;top:8px;right:calc(50% - 20px);width:12px;height:12px;border-radius:50%;background:var(--cherry);border:2px solid #fff}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,label:focus-within{outline:3px solid var(--cherry);outline-offset:2px}
.view[hidden]{display:none}
h2.h{font-size:22px;margin:4px 0 12px}
.shoot{display:flex;flex-direction:column;align-items:center;padding:24px 0 8px;text-align:center}
.shoot label{width:220px;height:220px;border-radius:50%;background:var(--leaf);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;font-size:20px;font-weight:700;padding:20px}
.shoot label svg{width:72px;height:72px}
.hidden-input{position:absolute;opacity:0;width:1px;height:1px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:2px solid var(--leaf);border-radius:999px;overflow:hidden;max-width:360px;margin:4px auto 0}
.seg button{min-height:52px;border:0;background:var(--paper);color:var(--leaf);font:inherit;font-weight:700;font-size:18px}
.seg button[aria-pressed="true"]{background:var(--leaf);color:#fff}
.box{background:var(--mist);border-radius:14px;padding:14px 18px;margin:16px 0}
.box p{margin:.25em 0}
.box h3{margin:0 0 6px;font-size:18px}
.status{font-size:15px;color:var(--soft);margin-top:14px;text-align:center}
.warn{color:var(--amber);font-weight:700}
.small{font-size:14px;color:var(--soft)}
.photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block}
.verdict{margin-top:-28px;position:relative;border-radius:14px;padding:18px;color:#fff;background:var(--leaf)}
.verdict.problem{background:var(--cherry)}.verdict.unsure{background:var(--amber)}
.verdict h2{margin:0 0 6px;font-size:26px;line-height:1.15}
.conf{display:flex;align-items:center;gap:10px;font-size:15px}
.bar{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.3);overflow:hidden}.bar i{display:block;height:100%;background:#fff}
.advice{font-size:19px;margin:18px 2px}
.context{border-left:5px solid var(--amber);padding:6px 12px;margin:0 2px 16px;font-size:16px}
.actions{display:grid;gap:12px}
.btn{min-height:56px;border-radius:12px;border:2px solid var(--leaf);background:var(--paper);color:var(--leaf);font:inherit;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px;width:100%;cursor:pointer}
.btn.main{background:var(--leaf);color:#fff}.btn svg{width:24px;height:24px;flex:none}.btn[disabled]{opacity:.5}
.alert{border-radius:14px;padding:14px 16px;margin:0 0 12px;border:2px solid var(--line)}
.alert.high{border-color:var(--cherry);background:#FBECEE}.alert.medium{border-color:var(--amber);background:#FBF3E6}.alert.info{background:var(--mist);border-color:var(--mist)}
.alert b{display:block;font-size:19px}.alert p{margin:.3em 0 0}
.level{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;margin-bottom:6px;color:#fff;background:var(--soft)}
.alert.high .level{background:var(--cherry)}.alert.medium .level{background:var(--amber)}
.field{display:block;margin:0 0 14px}.field span{display:block;font-weight:700;margin-bottom:6px}
.field input,.field select{width:100%;min-height:52px;border:2px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:12px;align-items:flex-start;margin:0 0 14px}.check input{width:26px;height:26px;margin-top:2px;flex:none}
.price{font-size:28px;font-weight:700;line-height:1.1;margin:4px 0}
.spark{display:flex;align-items:flex-end;gap:4px;height:44px;margin:8px 0 2px}.spark i{flex:1;background:var(--leaf);border-radius:3px 3px 0 0;opacity:.75}
.offer{border-radius:14px;padding:16px;margin:14px 0;color:#fff;background:var(--leaf)}
.offer.low{background:var(--cherry)}.offer.high{background:#1d5f74}.offer b{font-size:22px;display:block}
.crop{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-bottom:10px}
.crop .lbl{font-weight:700;align-self:center}
.crop input{width:100%;min-height:48px;border:2px solid var(--line);border-radius:10px;padding:0 10px;font:inherit}
.rec{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec img,.rec .ic{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--mist);display:flex;align-items:center;justify-content:center;font-size:28px}
.rec b{display:block}.rec span{font-size:14px;color:var(--soft)}
.tag{display:inline-block;font-size:13px;border-radius:999px;padding:2px 10px;margin-top:4px;background:var(--mist);color:var(--leaf);font-style:normal}
.tag.queued{background:#FBEFD9;color:var(--amber)}
.empty{text-align:center;padding:30px 10px;color:var(--soft)}
.demo{background:#FBF3E6;color:var(--amber);font-weight:700;font-size:14px;text-align:center;padding:6px 10px}
@media (prefers-reduced-motion:no-preference){.verdict,.offer{animation:rise .35s ease-out}@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header>
  <h1>Croppy<small data-t="tagline"></small></h1>
  <button class="lang" id="langBtn" type="button"></button>
</header>
<div class="demo" id="demoBanner" hidden data-t="demoBanner"></div>

<main>
<!-- ================= CHECK ================= -->
<section class="view" id="v-check">
  <div class="seg" role="group" id="cropSeg"><button type="button" data-crop="coffee" data-t="cropCoffee"></button><button type="button" data-crop="beans" data-t="cropBeans"></button></div>
  <div class="shoot">
    <label for="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="4"/></svg><span data-t="shoot"></span></label>
    <input id="cam" class="hidden-input" type="file" accept="image/*" capture="environment">
  </div>
  <p class="status" id="modelStatus"></p>
  <div class="box"><p><b data-t="tipsTitle"></b></p><p data-t="tip1"></p><p data-t="tip2"></p><p data-t="tip3"></p></div>
</section>

<!-- ================= RESULT ================= -->
<section class="view" id="v-result" hidden>
  <img class="photo" id="photo" alt="">
  <div class="verdict" id="verdict"><h2 id="vTitle"></h2><div class="conf"><span id="vConfLabel"></span><div class="bar"><i id="vBar"></i></div></div></div>
  <p class="advice" id="vAdvice"></p>
  <p class="context" id="vContext" hidden></p>
  <p class="small" id="vAlt" hidden></p>
  <div class="actions">
    <button class="btn main" id="playBtn" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span data-t="listen"></span></button>
    <button class="btn" id="saveBtn" type="button"><span data-t="save"></span></button>
    <button class="btn" id="smsBtn" type="button"><span data-t="sendOfficer"></span></button>
    <button class="btn" id="againBtn" type="button"><span data-t="again"></span></button>
  </div>
  <p class="small" data-t="humanNote"></p>
</section>

<!-- ================= ALERTS ================= -->
<section class="view" id="v-alerts" hidden>
  <h2 class="h" data-t="alertsTitle"></h2>
  <div id="alertList"></div>
  <div class="box" id="climateBox"></div>
  <div class="box" id="soilBox"></div>
  <p class="small" data-t="alertsNote"></p>
</section>

<!-- ================= SELL ================= -->
<section class="view" id="v-sell" hidden>
  <h2 class="h" data-t="sellTitle"></h2>
  <label class="field"><span data-t="whatSell"></span><select id="sellItem"></select></label>
  <div class="box" id="priceBox"></div>
  <div class="row2">
    <label class="field"><span data-t="kgToSell"></span><input type="number" inputmode="decimal" min="0" id="sellKg"></label>
    <label class="field"><span data-t="buyerOffer"></span><input type="number" inputmode="decimal" min="0" id="sellOffer"></label>
  </div>
  <div id="offerBox"></div>
  <div class="actions">
    <button class="btn main" id="sellPlay" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span data-t="listen"></span></button>
    <button class="btn" id="sellSave" type="button"><span data-t="recordSale"></span></button>
  </div>
  <div class="box">
    <h3 data-t="harvestTitle"></h3>
    <div class="row2">
      <label class="field"><span data-t="crop"></span><select id="harvCrop"></select></label>
      <label class="field"><span data-t="kgHarvested"></span><input type="number" inputmode="decimal" min="0" id="harvKg"></label>
    </div>
    <button class="btn" id="harvSave" type="button"><span data-t="recordHarvest"></span></button>
    <div id="stockBox" style="margin-top:12px"></div>
  </div>
  <p class="small" data-t="sellNote"></p>
</section>

<!-- ================= MY FARM ================= -->
<section class="view" id="v-farm" hidden>
  <h2 class="h" data-t="farmTitle"></h2>
  <p class="small" data-t="farmWhy"></p>
  <label class="field"><span data-t="sName"></span><input type="text" id="fName" autocomplete="name"></label>
  <div class="row2">
    <label class="field"><span data-t="village"></span><input type="text" id="fVillage"></label>
    <label class="field"><span data-t="memberNo"></span><input type="text" id="fMember"></label>
  </div>
  <label class="field"><span data-t="myPhone"></span><input type="tel" id="fPhone"></label>
  <p><b data-t="myCrops"></b></p>
  <div class="crop small"><span></span><span data-t="areaAcres"></span><span data-t="trees"></span></div>
  <div id="cropRows"></div>
  <label class="check"><input type="checkbox" id="sGps"><span data-t="sGps"></span></label>
  <label class="check"><input type="checkbox" id="fConsent"><span data-t="consent"></span></label>
  <button class="btn main" id="regBtn" type="button"><span data-t="shareCoop"></span></button>
  <p class="small" id="regStatus"></p>

  <h2 class="h" style="margin-top:28px" data-t="contactsTitle"></h2>
  <label class="field"><span data-t="sOfficer"></span><input type="tel" id="sOfficer" placeholder="+256 7xx xxx xxx"></label>
  <label class="field"><span data-t="sCoop"></span><input type="tel" id="sCoop"></label>

  <div class="box"><h3 data-t="dataTitle"></h3><p id="modelInfo"></p><p id="packInfo"></p>
    <label class="btn" for="modelFiles" style="margin-top:10px"><span data-t="loadModel"></span></label>
    <input type="file" id="modelFiles" class="hidden-input" multiple accept=".json,.bin">
    <label class="btn" for="packFile" style="margin-top:10px"><span data-t="loadPack"></span></label>
    <input type="file" id="packFile" class="hidden-input" accept=".json">
    <p class="small" data-t="loadHelp"></p></div>
  <div class="box"><h3 data-t="privacyTitle"></h3><p class="small" data-t="privacy"></p></div>
  <button class="btn" id="wipeBtn" type="button"><span data-t="wipe"></span></button>
</section>

<!-- ================= RECORDS ================= -->
<section class="view" id="v-records" hidden>
  <h2 class="h" data-t="navRecords"></h2>
  <div id="recList"></div>
  <div class="actions" style="margin-top:18px"><button class="btn" id="csvBtn" type="button"><span data-t="exportCsv"></span></button></div>
</section>
</main>

<nav>
  <button type="button" data-view="check" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span data-t="navCheck"></span></button>
  <button type="button" data-view="alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/></svg><span data-t="navAlerts"></span><i class="dot" id="alertDot" hidden></i></button>
  <button type="button" data-view="sell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12 12 3h8v8l-9 9z"/><circle cx="16" cy="7" r="1.5"/></svg><span data-t="navSell"></span></button>
  <button type="button" data-view="farm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11 12 4l9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg><span data-t="navFarm"></span></button>
  <button type="button" data-view="records"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></svg><span data-t="navRecords"></span></button>
</nav>

<script src="vendor/tf.min.js"></script>

/* ---------- Speech: pre-recorded clips if present, phone TTS otherwise ---------- */
let audio=null;
function speak(text,clip){
  if(audio)audio.pause(); if("speechSynthesis" in window)speechSynthesis.cancel();
  const tts=()=>{if(!("speechSynthesis" in window))return;const u=new SpeechSynthesisUtterance(text);u.lang=lang==="sw"?"sw-KE":"en-GB";u.rate=0.9;
    const v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(lang));if(v)u.voice=v;speechSynthesis.speak(u)};
  if(clip){audio=new Audio(clip);audio.play().catch(tts)}else tts();
}

/* ================= REGION PACK (offline context data) ================= */
async function initPack(){
  const saved=store.get("pack",null);
  if(saved) pack=saved;
  else { try{const r=await fetch("region/pack.json");if(r.ok)pack=await r.json()}catch(e){} }

}
$("#packFile").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const p=JSON.parse(await f.text());if(!p.climate||!p.prices)throw 0;pack=p;store.set("pack",p);computeAlerts();applyText()}

};

/* ---------- Alerts: transparent rules, shown with their reasons ---------- */
function computeAlerts(){
  alerts=[]; if(!pack){$("#alertDot").hidden=true;return}
  const rec=pack.climate.recent||[], last=rec.slice(-14), wk=rec.slice(-7), d21=rec.slice(-21);
  const lastDate=rec.length?rec[rec.length-1].date:pack.built;
  if(daysSince(lastDate)>STALE_DAYS) alerts.push({lv:"medium",title:t("aStale",{d:lastDate}),body:""});
  // Rust: spores need leaf wetness and mild temperatures (~18–28°C mean) for infection.
  const rustDays=last.filter(d=>d.rain>=5&&d.rh>=80&&(d.tmin+d.tmax)/2>=18&&(d.tmin+d.tmax)/2<=28).length;
  if(rustDays>=3) alerts.push({key:"rust",lv:rustDays>=5?"high":"medium",title:t("aRustT"),body:t("aRustB",{n:rustDays})});
  const cold=wk.filter(d=>d.tmin<10).length;
  if(cold>=2) alerts.push({key:"cold",lv:"medium",title:t("aColdT"),body:t("aColdB",{n:cold})});
  const m=new Date().getMonth()+1, norm=(pack.climate.normals||[]).find(x=>x.m===m);
  const rain21=d21.reduce((a,d)=>a+d.rain,0);
  if(norm&&norm.rain>=60&&rain21<norm.rain*0.25) alerts.push({lv:"medium",title:t("aDryT"),body:t("aDryB",{mm:Math.round(rain21)})});
  const hot=wk.filter(d=>d.tmax>30).length;
  if(hot>=3) alerts.push({lv:"medium",title:t("aHeatT"),body:t("aHeatB",{n:hot})});
  const mine=myCrops();
  Object.entries(pack.crops||{}).forEach(([k,c])=>{if((!mine.length||mine.includes(k))&&c.harvest_months?.includes(m))alerts.push({lv:"info",title:t("aHarvT",{c:L(c.label)}),body:t("aHarvB")})});
  $("#alertDot").hidden=!alerts.some(a=>a.lv==="high");
}
function renderAlerts(){
  computeAlerts();
  const list=$("#alertList");list.innerHTML="";
  if(!pack){list.append(el("p","empty",t("noPack")));$("#climateBox").hidden=$("#soilBox").hidden=true;return}
  if(!alerts.length) list.append(el("p","empty",t("noAlerts")));
  alerts.forEach(a=>{const d=el("div","alert "+a.lv);d.append(el("span","level",t(a.lv==="high"?"lvHigh":a.lv==="medium"?"lvMedium":"lvInfo")),el("b",null,a.title));if(a.body)d.append(el("p",null,a.body));list.append(d)});
  const rec=pack.climate.recent||[], m=new Date().getMonth()+1, norm=(pack.climate.normals||[]).find(x=>x.m===m);
  const cb=$("#climateBox");cb.hidden=!rec.length;cb.innerHTML="";
  if(rec.length){cb.append(el("h3",null,t("climTitle")),el("p",null,t("climBody",{r:Math.round(rec.reduce((a,d)=>a+d.rain,0)),n:norm?norm.rain:"–",lo:Math.min(...rec.map(d=>d.tmin)),hi:Math.max(...rec.map(d=>d.tmax))})),el("p","small",pack.climate.source||""))}
  const s=pack.soil, sb=$("#soilBox");sb.hidden=!s;sb.innerHTML="";
  if(s){sb.append(el("h3",null,t("soilTitle")+(s.depth?" ("+s.depth+")":"")));
    sb.append(el("p",null,s.ph<5.5?t("soilAcid",{ph:s.ph}):t("soilOk",{ph:s.ph})));
    if(s.n_gkg!=null&&s.n_gkg<1)sb.append(el("p",null,t("soilN",{v:s.n_gkg})));
    if(s.soc_gkg!=null&&s.soc_gkg<10)sb.append(el("p",null,t("soilSoc",{v:s.soc_gkg})));
    sb.append(el("p","small",s.source||""))}
}

/* ================= SELL: fair-price check (reference data, not prediction) ================= */
function priceItems(){return pack?Object.entries(pack.prices||{}):[]}
function renderSell(){
  const sel=$("#sellItem"),keep=sel.value;sel.innerHTML="";
  priceItems().forEach(([k,p])=>{const o=el("option",null,L(p.label));o.value=k;sel.append(o)});
  if(keep)sel.value=keep;
  const hc=$("#harvCrop"),hk=hc.value;hc.innerHTML="";
  CROPS.forEach(c=>{const o=el("option",null,L(pack?.crops?.[c]?.label)||c);o.value=c;hc.append(o)});if(hk)hc.value=hk;
  const pb=$("#priceBox");pb.innerHTML="";
  const p=pack?.prices?.[sel.value];
  if(!p){pb.append(el("p",null,t("noPack")));$("#offerBox").innerHTML="";renderStock();return}
  pb.append(el("p",null,t("fairRange")),el("p","price",money(p.low)+" – "+money(p.high)));
  if(p.trend?.length>=4){const sp=el("div","spark"),mx=Math.max(...p.trend),mn=Math.min(...p.trend)*0.9;
    p.trend.forEach(v=>{const i=el("i");i.style.height=(15+85*(v-mn)/(mx-mn||1))+"%";sp.append(i)});pb.append(sp);
    const a=p.trend.at(-1),b=p.trend.at(-4),ch=(a-b)/b;pb.append(el("p",null,ch>0.03?t("trendUp"):ch<-0.03?t("trendDown"):t("trendFlat")))}
  if(daysSince(p.date+"-28")>PRICE_STALE_DAYS)pb.append(el("p","warn",t("priceStale",{d:p.date})));
  pb.append(el("p","small",(p.source||"")+" · "+p.date));
  renderOffer();renderStock();
}
function offerResult(){
  const p=pack?.prices?.[$("#sellItem").value], kg=+$("#sellKg").value, off=+$("#sellOffer").value;
  if(!p||!off)return null;
  const pct=Math.round(100*(p.low-off)/p.low);
  const cls=off<p.low?"low":off>p.high?"high":"";
  const head=off<p.low?t("offerLow",{p:pct}):off>p.high?t("offerHigh"):t("offerOk");
  const body=(off<p.low?t("offerLowB")+" ":"")+(kg?t("offerTotal",{t:money(kg*off),a:money(kg*p.low),b:money(kg*p.high)}):"");
  return {p,kg,off,cls,head,body};
}
function renderOffer(){
  const box=$("#offerBox");box.innerHTML="";const r=offerResult();if(!r)return;
  const d=el("div","offer "+r.cls);d.append(el("b",null,r.head));if(r.body)d.append(el("p",null,r.body));box.append(d);
}

function renderStock(){
  const box=$("#stockBox");box.innerHTML="";const H=store.get("harvests",[]),S=store.get("sales",[]),farm=store.get("farm",{});

$("#sGps").onchange=e=>store.set("gps",e.target.checked);
$("#regBtn").onclick=async()=>{
  const f=store.get("farm",{}),coop=store.get("coop","");
  if(!f.consent){$("#regStatus").textContent=t("needConsent");return}
  if(!coop){$("#regStatus").textContent=t("needCoop");return}
  const g=await getGps();
  const crops=CROPS.filter(c=>+(f.crops?.[c]?.acres)>0).map(c=>`${c}:${f.crops[c].acres}ac${f.crops[c].trees?"/"+f.crops[c].trees+"t":""}`).join(",");
  const body=`CROPPY-REG|${f.name||""}|${f.village||""}|${f.member||""}|${f.phone||""}|${crops}${g?`|${g.lat},${g.lon}`:""}`;
  f.sharedAt=new Date().toISOString();store.set("farm",f);renderFarm();
  location.href=`sms:${encodeURIComponent(coop)}?body=${encodeURIComponent(body)}`;
};

/* ================= LEAF MODEL (the AI) ================= */
async function loadAny(src){try{return await tf.loadGraphModel(src)}catch(e){return await tf.loadLayersModel(src)}}
async function initModel(){
  setStatus(t("loading"));
  for(const c of Object.keys(MODELS)){
    const {dir,idb}=MODELS[c];
    try{const r=await fetch(dir+"/metadata.json",{cache:"no-cache"});if(r.ok){const m=await r.json();M[c]={meta:m,model:await loadAny(dir+"/model.json")}}}catch(e){}
    if(!M[c].model){const m=store.get("meta_"+c,null);if(m){try{M[c]={meta:m,model:await loadAny("indexeddb://"+idb)}}catch(e){}}}
    if(M[c].model){const mm=M[c];tf.tidy(()=>{const s=mm.meta.input_size||224;run(mm.model,tf.zeros([1,s,s,3]))})}
  }
  refreshDataText();
}
function setStatus(msg,warn){const e=$("#modelStatus");e.textContent=msg;e.classList.toggle("warn",!!warn)}
function refreshDataText(){
  setStatus(M[crop].model?t("ready"):t("noModel"),!M[crop].model);
  const d=c=>M[c].model?t("modelLoaded",{n:M[c].meta.labels.length,t:Math.round((M[c].meta.threshold||DEFAULT_THRESHOLD)*100)}):t("none");
  $("#modelInfo").textContent=t("modelsLine",{c:d("coffee"),b:d("beans")});
  $("#packInfo").textContent=pack?t("packLoaded",{r:L(pack.region),d:pack.built}):t("noPack");
  $("#demoBanner").hidden=!pack?.synthetic;
}
$("#modelFiles").onchange=async e=>{
  const files=[...e.target.files];const json=files.find(f=>f.name==="model.json"),metaF=files.find(f=>f.name==="metadata.json"),bins=files.filter(f=>f.name.endsWith(".bin"));
  try{if(!json||!metaF||!bins.length)throw 0;const m=JSON.parse(await metaF.text());const c=MODELS[m.crop]?m.crop:"coffee";
    const mdl=await loadAny(tf.io.browserFiles([json,...bins]));await mdl.save("indexeddb://"+MODELS[c].idb);
    M[c]={model:mdl,meta:m};store.set("meta_"+c,m);refreshDataText()}
  catch(err){$("#modelInfo").textContent=t("modelBad")}
  e.target.value="";
};
function run(model,x){const out=model.predict?model.predict(x):model.execute(x);const y=Array.isArray(out)?out[0]:out;const s=y.sum().dataSync()[0];return Math.abs(s-1)<0.01?y:tf.softmax(y)}
function prepCanvas(img,size){const c=document.createElement("canvas");c.width=c.height=size;const g=c.getContext("2d"),m=Math.min(img.naturalWidth,img.naturalHeight);
  g.drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,size,size);return c}
/* Non-AI photo checks so the model never guesses on a bad photo */
function quality(c){const s=c.width,d=c.getContext("2d").getImageData(0,0,s,s).data,g=new Float32Array(s*s);let sum=0;
  for(let i=0;i<s*s;i++){const v=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];g[i]=v;sum+=v}
  let a=0,b=0,n=0;for(let y=1;y<s-1;y++)for(let x=1;x<s-1;x++){const i=y*s+x,l=4*g[i]-g[i-1]-g[i+1]-g[i-s]-g[i+s];a+=l;b+=l*l;n++}
  return{dark:sum/(s*s)<45,blurry:b/n-(a/n)**2<25}}
async function classify(img){
  const {model,meta}=M[crop],size=meta.input_size||224,c=prepCanvas(img,size),q=quality(c);
  const probs=tf.tidy(()=>run(model,tf.browser.fromPixels(c).toFloat().expandDims(0))).dataSync();
  const r=[...probs].map((p,i)=>({key:meta.labels[i],p})).sort((a,b)=>b.p-a.p);
  const thr=meta.threshold||DEFAULT_THRESHOLD,top=r[0],sec=r[1]||{p:0};
  let key=top.key,reason=null;
  if(q.dark){key="unsure";reason="tooDark"}else if(q.blurry){key="unsure";reason="tooBlurry"}
  else if(top.p<thr||top.p-sec.p<MARGIN){key="unsure";reason="maybe"}
  return{id:Date.now(),time:new Date().toISOString(),crop,key,top:top.key,conf:top.p,second:sec.key,reason,thumb:prepCanvas(img,128).toDataURL("image/jpeg",0.7),photo:img.src,status:null};
}
$("#cam").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  if(!M[crop].model){setStatus(t("noModel"),true);return}
  const img=new Image();img.src=URL.createObjectURL(f);await img.decode();
  current=await classify(img);showResult(current);
};
const cropWord=c=>t(c==="beans"?"wBeans":"wCoffee");
const labelOf=(k,c)=>k==="other"?t("otherT",{c:cropWord(c||crop)}):(ADVICE[k]||ADVICE.unsure)[lang].t;
const adviceOf=(k,c)=>k==="other"?{kind:"unsure",t:labelOf(k,c),a:t("otherB",{c:cropWord(c||crop)})}:{kind:(ADVICE[k]||ADVICE.unsure).kind,...(ADVICE[k]||ADVICE.unsure)[lang]};
function contextNote(k){
  computeAlerts();
  if(k==="rust"&&alerts.some(a=>a.key==="rust"))return t("ctxRust");
  if(k==="phoma"&&alerts.some(a=>a.key==="cold"))return t("ctxPhoma");
  if(k==="healthy"&&pack)return t("ctxHealthy");
  return "";
}
function showResult(r){
  const a=adviceOf(r.key,r.crop);
  $("#photo").src=r.photo||r.thumb;
  $("#verdict").className="verdict "+(a.kind==="problem"?"problem":a.kind==="unsure"?"unsure":"");
  $("#vTitle").textContent=a.t;
  $("#vConfLabel").textContent=t("confidence")+": "+Math.round(r.conf*100)+"%";$("#vBar").style.width=Math.round(r.conf*100)+"%";
  $("#vAdvice").textContent=(r.reason==="tooDark"||r.reason==="tooBlurry"?t(r.reason)+" ":"")+a.a;
  const ctx=contextNote(r.key),ce=$("#vContext");ce.hidden=!ctx;ce.textContent=ctx;
  const alt=$("#vAlt");if(r.reason==="maybe"){alt.hidden=false;alt.textContent=t("maybe",{a:labelOf(r.top,r.crop),b:labelOf(r.second,r.crop)})}else alt.hidden=true;
  const saved=store.get("records",[]).some(x=>x.id===r.id);$("#saveBtn").disabled=saved;$("#saveBtn").querySelector("span").textContent=saved?t("saved"):t("save");
  go("result");
}
$("#againBtn").onclick=()=>{current=null;go("check")};
$("#playBtn").onclick=()=>{if(current)speak($("#vTitle").textContent+". "+$("#vAdvice").textContent+" "+$("#vContext").textContent,`audio/${lang}/${current.key}.mp3`)};

/* ================= RECORDS ================= */
async function getGps(){if(!store.get("gps",false)||!navigator.geolocation)return null;
  return new Promise(res=>navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(4),lon:+p.coords.longitude.toFixed(4)}),()=>res(null),{timeout:8000,maximumAge:600000}))}
async function saveCurrent(){const recs=store.get("records",[]);if(recs.some(x=>x.id===current.id))return;
  recs.unshift({...current,photo:undefined,gps:await getGps(),status:"queued"});store.set("records",recs.slice(0,200));
  $("#saveBtn").disabled=true;$("#saveBtn").querySelector("span").textContent=t("saved")}
$("#saveBtn").onclick=saveCurrent;
$("#smsBtn").onclick=async()=>{
  const num=store.get("officer","");if(!num){alert(t("needOfficer"));go("farm");return}
  await saveCurrent();
  const recs=store.get("records",[]),q=recs.filter(r=>r.status==="queued").slice(0,3),f=store.get("farm",{});
  const lines=q.map(r=>`${new Date(r.time).toLocaleDateString()}: ${labelOf(r.key,r.crop)} (${Math.round(r.conf*100)}%)${r.gps?` @${r.gps.lat},${r.gps.lon}`:""}`);
  const body=`${t("smsHead")}\n${f.name||""} ${f.village||""} ${f.member||""}\n${lines.join("\n")}`;
  q.forEach(r=>r.status="sent");store.set("records",recs);
  location.href=`sms:${encodeURIComponent(num)}?body=${encodeURIComponent(body)}`;
};
function renderRecords(){
  const list=$("#recList");list.innerHTML="";
  const items=[...store.get("records",[]).map(r=>({...r,type:"leaf"})),...store.get("sales",[]).map(r=>({...r,type:"sale"})),...store.get("harvests",[]).map(r=>({...r,type:"harvest"}))].sort((a,b)=>b.id-a.id);
  if(!items.length){list.append(el("p","empty",t("emptyRec")));return}
  items.forEach(r=>{const row=el("div","rec"),txt=el("div");
    if(r.type==="leaf"){const im=el("img");im.alt="";im.src=r.thumb;row.append(im);txt.append(el("b",null,labelOf(r.key,r.crop)),el("span",null,new Date(r.time).toLocaleString()+" · "+Math.round(r.conf*100)+"%"),el("br"));
      const tg=el("em","tag"+(r.status!=="sent"?" queued":""),t(r.status==="sent"?"sent":"queued"));txt.append(tg)}
    else{row.append(el("div","ic",r.type==="sale"?"💰":"🧺"));const lab=L(pack?.crops?.[r.crop]?.label)||r.crop;
      txt.append(el("b",null,(r.type==="sale"?t("sale"):t("harvest"))+": "+lab+", "+r.kg+" kg"),el("span",null,new Date(r.time).toLocaleDateString()+(r.type==="sale"?" · "+money(r.price)+"/kg":"")))}
    row.append(txt);list.append(row)});
}
$("#csvBtn").onclick=()=>{
  const rows=[["type","time","crop_or_result","kg","price_per_kg","confidence","lat","lon","status"]];
  store.get("records",[]).forEach(r=>rows.push(["leaf_"+(r.crop||"coffee"),r.time,r.key,"","",r.conf.toFixed(3),r.gps?.lat??"",r.gps?.lon??"",r.status]));
  store.get("harvests",[]).forEach(r=>rows.push(["harvest",r.time,r.crop,r.kg,"","","","",""]));
  store.get("sales",[]).forEach(r=>rows.push(["sale",r.time,r.crop,r.kg,r.price,"","","",""]));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(",")).join("\n")],{type:"text/csv"}));a.download="croppy-records.csv";a.click();
};
$("#wipeBtn").onclick=()=>{if(confirm(t("wipeAsk"))){["records","sales","harvests"].forEach(k=>store.set(k,[]));renderRecords();renderStock()}};

/* ---------- Boot ---------- */
applyText();initPack();initModel();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
